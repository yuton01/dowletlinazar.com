<!DOCTYPE html>
<html lang="tk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Synag netijeleri — Döwletli Nazar Bilim Merkezi</title>
<link rel="icon" type="image/png" href="dowLogo.png">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#0e1a24;--paper:#f4efe6;--sand:#e8dcc8;--gold:#c9a24a;--gold-soft:#f0e2bd;--teal:#1b6b63;--teal-deep:#0f3f3b;--muted:#6a6156;--card:#fffdf8;--ease-out:cubic-bezier(0.22,1,0.36,1);--ease-soft:cubic-bezier(0.33,1,0.68,1)}
body{font-family:Manrope,sans-serif;background:var(--paper);color:var(--ink)}
nav{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 24px;position:sticky;top:0;z-index:100;background:rgba(244,239,230,.9);backdrop-filter:blur(14px);border-bottom:1px solid rgba(14,26,36,.06)}
.nav-brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.nav-logo{width:38px;height:38px;object-fit:contain}
.nav-title .main{font-family:Fraunces,serif;font-size:16px;font-weight:700;color:var(--teal-deep)}
.nav-title .sub{font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);font-weight:700}
.lang-switch{display:flex;align-items:center;background:#fff;padding:4px;border-radius:999px;border:1px solid rgba(14,26,36,.08)}
.lang-btn{background:none;border:none;font-weight:800;font-size:12px;color:var(--muted);cursor:pointer;padding:6px 11px;border-radius:999px;font-family:inherit}
.lang-btn.active{background:var(--teal);color:#fff}
.container{max-width:1100px;margin:28px auto;padding:0 16px}
.page-header{display:flex;flex-direction:column;gap:14px;margin-bottom:20px}
.page-title{font-family:Fraunces,serif;font-size:clamp(26px,6vw,40px);color:var(--teal-deep)}
.page-back{display:inline-flex;align-items:center;justify-content:center;background:var(--gold-soft);color:#6b4e12;font-weight:800;padding:10px 20px;border-radius:999px;text-decoration:none;width:fit-content}
#searchInput{width:100%;padding:14px 16px;font-family:inherit;font-size:15px;border:1.5px solid rgba(14,26,36,.1);border-radius:14px;outline:none;background:#fff;margin-bottom:18px}
#searchInput:focus{border-color:var(--teal);box-shadow:0 8px 20px rgba(27,107,99,.1)}
.hint{font-size:12px;color:var(--muted);margin-bottom:10px;font-weight:600}
/* Horizontal scroll so ALL columns visible on phone */
.table-scroll{
  width:100%;
  overflow-x:auto;
  -webkit-overflow-scrolling:touch;
  border-radius:18px;
  border:1px solid rgba(14,26,36,.06);
  background:var(--card);
  box-shadow:0 10px 28px rgba(14,26,36,.04);
}
.table-scroll::-webkit-scrollbar{height:6px}
.table-scroll::-webkit-scrollbar-thumb{background:var(--sand);border-radius:999px}
table{width:100%;min-width:640px;border-collapse:collapse;text-align:left}
th{
  background:var(--sand);
  color:var(--teal-deep);
  font-size:11px;
  font-weight:800;
  padding:12px 10px;
  text-transform:uppercase;
  letter-spacing:.3px;
  white-space:nowrap;
  position:sticky;top:0;
}
td{padding:12px 10px;border-bottom:1px solid rgba(14,26,36,.06);font-size:14px;white-space:nowrap}
tr:last-child td{border-bottom:none}
tr:hover td{background:#faf6ee}
td:first-child{font-weight:700;min-width:140px;white-space:normal}
.score-badge{
  display:inline-block;
  min-width:36px;
  text-align:center;
  padding:4px 8px;
  border-radius:10px;
  font-weight:800;
  font-size:13px;
  background:var(--gold-soft);
  color:#6b4e12;
}
.score-badge.final{background:var(--teal);color:#fff}
footer{text-align:center;padding:24px;color:var(--muted);font-size:13px;margin-top:32px}
.reveal{opacity:0;transform:translateY(14px);transition:opacity 1s var(--ease-out),transform 1s var(--ease-out)}
.reveal.is-visible{opacity:1;transform:none}
@media(max-width:600px){
  nav{padding:12px 14px}
  .nav-title .main{font-size:14px}
  th,td{padding:10px 8px;font-size:12px}
  .score-badge{min-width:32px;padding:3px 6px;font-size:12px}
}
</style>
</head>
<body>
<nav>
  <a class="nav-brand" href="index.html">
    <img src="dowLogo.png" class="nav-logo" alt="Logo">
    <div class="nav-title">
      <span class="main">Döwletli Nazar</span>
      <span class="sub">Bilim Merkezi</span>
    </div>
  </a>
  <div class="lang-switch">
    <button class="lang-btn active" data-lang="tk">TK</button>
    <button class="lang-btn" data-lang="ru">RU</button>
  </div>
</nav>

<div class="container">
  <div class="page-header reveal">
    <h1 class="page-title" data-key="pageTitle">Synag netijeleri</h1>
    <a href="index.html" class="page-back" data-key="backBtn">← Baş sahypa</a>
  </div>

  <input type="text" id="searchInput" class="reveal" placeholder="Okuwçynyň ady boýunça gözleg..." data-placeholder="searchPlaceholder">

  <p class="hint reveal" data-key="scrollHint">←→ Ähli netijeleri görmek üçin ýana süýşüriň</p>

  <div class="table-scroll reveal">
    <table>
      <thead>
        <tr>
          <th data-key="thName">Okuwçynyň ady</th>
          <th data-key="thExam1">Synag 1</th>
          <th data-key="thExam2">Synag 2</th>
          <th data-key="thExam3">Synag 3</th>
          <th data-key="thSpeaking">Gepleşik</th>
          <th data-key="thFinal">Soňky synag</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
</div>

<footer>© 2024 Döwletli Nazar Bilim Merkezi · Nazar</footer>

<script>
  const students = [
    { name: "Dowlet Saparow", exam1: 85, exam2: 90, exam3: 88, speaking: 87, final: 89 },
    { name: "Begenç Çaryýew", exam1: 92, exam2: 95, exam3: 98, speaking: 94, final: 96 },
    { name: "Selim Dowltow", exam1: 78, exam2: 82, exam3: 80, speaking: 81, final: 83 },
    { name: "Ahmet Yslamow", exam1: 88, exam2: 85, exam3: 91, speaking: 90, final: 90 },
    { name: "Muhammet Hallyyew", exam1: 65, exam2: 70, exam3: 72, speaking: 68, final: 71 },
    { name: "Rejep Jumayew", exam1: 95, exam2: 91, exam3: 94, speaking: 96, final: 95 },
    { name: "Yslam Rejepow", exam1: 82, exam2: 79, exam3: 85, speaking: 84, final: 86 },
    { name: "Ali Emirow", exam1: 90, exam2: 88, exam3: 92, speaking: 91, final: 93 },
    { name: "Enejan Abdyyewa", exam1: 73, exam2: 75, exam3: 70, speaking: 74, final: 76 },
    { name: "Mahri Tajiyewa", exam1: 89, exam2: 93, exam3: 87, speaking: 90, final: 91 }
  ];

  const searchInput = document.getElementById('searchInput');
  const tableBody = document.getElementById('tableBody');

  function renderTable(data) {
    tableBody.innerHTML = data.map(s => `
      <tr>
        <td><strong>${s.name}</strong></td>
        <td><span class="score-badge">${s.exam1}</span></td>
        <td><span class="score-badge">${s.exam2}</span></td>
        <td><span class="score-badge">${s.exam3}</span></td>
        <td><span class="score-badge">${s.speaking}</span></td>
        <td><span class="score-badge final">${s.final}</span></td>
      </tr>
    `).join('');
  }

  searchInput.addEventListener('input', (e) => {
    const value = e.target.value.toLowerCase();
    renderTable(students.filter(s => s.name.toLowerCase().includes(value)));
  });
  renderTable(students);

  document.querySelectorAll('.reveal').forEach(el => {
    el.classList.add('is-visible');
  });

  const translations = {
    tk: {
      pageTitle: "Synag netijeleri",
      backBtn: "← Baş sahypa",
      searchPlaceholder: "Okuwçynyň ady boýunça gözleg...",
      scrollHint: "←→ Ähli netijeleri görmek üçin ýana süýşüriň",
      thName: "Okuwçynyň ady",
      thExam1: "Synag 1",
      thExam2: "Synag 2",
      thExam3: "Synag 3",
      thSpeaking: "Gepleşik",
      thFinal: "Soňky synag"
    },
    ru: {
      pageTitle: "Баллы экзаменов",
      backBtn: "← На главную",
      searchPlaceholder: "Поиск по имени ученика...",
      scrollHint: "←→ Проведите в сторону, чтобы увидеть все результаты",
      thName: "Имя ученика",
      thExam1: "Экзамен 1",
      thExam2: "Экзамен 2",
      thExam3: "Экзамен 3",
      thSpeaking: "Спикинг",
      thFinal: "Финальный экзамен"
    }
  };

  document.querySelectorAll('.lang-btn').forEach(btn => btn.addEventListener('click', () => {
    document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const lang = btn.getAttribute('data-lang');
    document.querySelectorAll('[data-key]').forEach(el => {
      const key = el.getAttribute('data-key');
      if (translations[lang][key]) el.textContent = translations[lang][key];
    });
    searchInput.placeholder = translations[lang].searchPlaceholder;
    document.documentElement.lang = lang;
  }));
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Баллы экзаменов — Döwletli Nazar Bilim Merkezi</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --blue: #1E8FE1;
    --blue-dark: #1570b8;
    --blue-light: #e8f4fd;
    --text: #1a1a2e;
    --muted: #6b7280;
    --white: #ffffff;
    --transition-fast: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    --transition-normal: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--white);
    color: var(--text);
    overflow-x: hidden;
  }

  /* KEYFRAMES FOR ANIMATIONS */
  @keyframes fadeInUp {
    from {
      opacity: 0;
      transform: translateY(20px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  /* NAV */
  nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 60px;
    border-bottom: 1px solid #f0f0f0;
    position: sticky;
    top: 0;
    background: rgba(255,255,255,0.95);
    backdrop-filter: blur(8px);
    z-index: 100;
  }

  .nav-brand {
    display: flex;
    align-items: center;
    gap: 14px;
    text-decoration: none;
  }

  .nav-logo {
    width: 48px;
    height: 48px;
    object-fit: contain;
  }

  .nav-title {
    display: flex;
    flex-direction: column;
  }

  .nav-title .main { font-size: 17px; font-weight: 800; color: var(--blue); letter-spacing: -0.3px; }
  .nav-title .sub { font-size: 11px; font-weight: 600; color: var(--muted); letter-spacing: 1.5px; text-transform: uppercase; }

  /* LANG SWITCH */
  .lang-switch {
    display: flex;
    align-items: center;
    gap: 4px;
    background: #f8f9fa;
    padding: 4px 8px;
    border-radius: 20px;
    border: 1px solid #e2e8f0;
  }

  .lang-btn {
    background: none;
    border: none;
    font-weight: 700;
    font-size: 13px;
    color: #64748b;
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 14px;
    transition: all var(--transition-fast);
  }

  .lang-btn.active {
    color: #ffffff;
    background-color: #0284c7;
  }

  .lang-divider { color: #cbd5e1; font-size: 12px; }

  /* CONTENT CONTAINER */
  .container {
    max-width: 1000px;
    margin: 40px auto;
    padding: 0 20px;
  }

  /* Исправлено: Фиксированное выравнивание заголовков без прыжков верстки */
  .page-header {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    margin-bottom: 30px;
    gap: 15px;
    animation: fadeInUp var(--transition-normal) forwards;
  }

  .page-title {
    font-size: clamp(24px, 4vw, 36px);
    font-weight: 800;
    color: var(--blue);
    white-space: nowrap;
  }

  .back-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    background: var(--blue-light);
    color: var(--blue);
    font-weight: 700;
    padding: 10px 24px;
    border-radius: 50px;
    text-decoration: none;
    transition: all var(--transition-fast);
    min-width: 150px; /* Предотвращает сужение кнопки при смене языка */
    text-align: center;
  }

  .back-btn:hover {
    background: var(--blue);
    color: white;
    transform: translateX(-3px);
  }

  /* SEARCH INPUT */
  .search-box {
    margin-bottom: 30px;
    animation: fadeInUp var(--transition-normal) 0.1s forwards;
    opacity: 0; /* Для плавного старта анимации */
  }

  #searchInput {
    width: 100%;
    padding: 16px 20px;
    font-family: inherit;
    font-size: 16px;
    border: 2px solid #e8f0f8;
    border-radius: 16px;
    outline: none;
    transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
  }

  #searchInput:focus {
    border-color: var(--blue);
    box-shadow: 0 10px 25px rgba(30,143,225,0.1);
  }

  /* TABLE STYLES */
  .table-wrapper {
    background: white;
    border: 2px solid #e8f0f8;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.03);
    animation: fadeInUp var(--transition-normal) 0.2s forwards;
    opacity: 0; /* Для плавного старта анимации */
  }

  table {
    width: 100%;
    border-collapse: collapse;
    text-align: left;
  }

  th {
    background: var(--blue-light);
    color: var(--blue);
    font-size: 14px;
    font-weight: 700;
    padding: 16px 20px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  td {
    padding: 16px 20px;
    border-bottom: 1px solid #f0f0f0;
    font-size: 15px;
    color: var(--text);
    transition: background-color var(--transition-fast), transform var(--transition-fast);
  }

  tr {
    transition: all var(--transition-fast);
  }

  tr:last-child td {
    border-bottom: none;
  }

  /* Анимация при наведении на строку */
  tr:hover td {
    background: #fbfdff;
    color: var(--blue-dark);
  }
  
  tr:hover td:first-child {
    transform: translateX(4px); /* Легкий сдвиг имени вправо */
  }

  .score-badge {
    display: inline-block;
    padding: 4px 10px;
    border-radius: 12px;
    font-weight: 700;
    font-size: 14px;
    background: #f0f7ff;
    color: var(--blue);
    transition: all var(--transition-fast);
  }

  tr:hover .score-badge {
    background: var(--blue);
    color: white;
  }

  footer {
    text-align: center;
    padding: 30px;
    border-top: 1px solid #f0f0f0;
    font-size: 13px;
    color: var(--muted);
    margin-top: 60px;
  }

  @media (max-width: 600px) {
    nav { padding: 14px 20px; }
    .page-header { grid-template-columns: 1fr; } /* Стек колонок на мобилках */
    .page-title { white-space: normal; }
    .container { margin: 20px auto; }
    th, td { padding: 12px 10px; font-size: 13px; }
    .back-btn { width: 100%; }
  }
</style>
</head>
<body>

<nav>
  <a class="nav-brand" href="index.html">
    <img src="dowLogo.png" class="nav-logo" alt="Logo">
    <div class="nav-title">
      <span class="main">Döwletli Nazar</span>
      <span class="sub">Bilim Merkezi</span>
    </div>
  </a>

  <div class="lang-switch">
    <button class="lang-btn active" data-lang="ru">RU</button>
    <span class="lang-divider">|</span>
    <button class="lang-btn" data-lang="tk">TK</button>
  </div>
</nav>

<div class="container">
  <div class="page-header">
    <h1 class="page-title" data-key="pageTitle">Баллы экзаменов</h1>
    <a href="index.html" class="back-btn" data-key="backBtn">← На главную</a>
  </div>

  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Поиск по имени ученика..." data-placeholder="searchPlaceholder">
  </div>

  <div class="table-wrapper">
    <table>
      <thead>
        <tr>
          <th data-key="thName">Имя ученика</th>
          <th data-key="thExam1">Экзамен 1</th>
          <th data-key="thExam2">Экзамен 2</th>
          <th data-key="thExam3">Экзамен 3</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
</div>

<footer>
  © 2024 Döwletli Nazar Bilim Merkezi · Nazar
</footer>

<script>
  const students = [
    { name: "Dowlet Saparow", exam1: 85, exam2: 90, exam3: 88 },
    { name: "Begenç Çaryýew", exam1: 92, exam2: 95, exam3: 98 },
    { name: "Selim Dowltow", exam1: 78, exam2: 82, exam3: 80 },
    { name: "Ahmet Yslamow", exam1: 88, exam2: 85, exam3: 91 },
    { name: "Muhammet Hallyyew", exam1: 65, exam2: 70, exam3: 72 },
    { name: "Rejep Jumayew", exam1: 95, exam2: 91, exam3: 94 },
    { name: "Yslam Rejepow", exam1: 82, exam2: 79, exam3: 85 },
    { name: "Ali Emirow", exam1: 90, exam2: 88, exam3: 92 },
    { name: "Enejan Abdyyewa", exam1: 73, exam2: 75, exam3: 70 },
    { name: "Mahri Tajiyewa", exam1: 89, exam2: 93, exam3: 87 }
  ];

  const searchInput = document.getElementById('searchInput');
  const tableBody = document.getElementById('tableBody');

  function renderTable(data) {
    tableBody.innerHTML = data.map(s => `
      <tr>
        <td><strong>${s.name}</strong></td>
        <td><span class="score-badge">${s.exam1}</span></td>
        <td><span class="score-badge">${s.exam2}</span></td>
        <td><span class="score-badge">${s.exam3}</span></td>
      </tr>
    `).join('');
  }

  searchInput.addEventListener('input', (e) => {
    const value = e.target.value.toLowerCase();
    const filtered = students.filter(s => 
      s.name.toLowerCase().includes(value)
    );
    renderTable(filtered);
  });

  renderTable(students);

  // ЯЗЫКОВОЙ СКРИПТ (RU/TK)
  const translations = {
    ru: {
      pageTitle: "Баллы экзаменов",
      backBtn: "← На главную",
      searchPlaceholder: "Поиск по имени ученика...",
      thName: "Имя ученика",
      thExam1: "Экзамен 1",
      thExam2: "Экзамен 2",
      thExam3: "Экзамен 3"
    },
    tk: {
      pageTitle: "Synag netijeleri",
      backBtn: "← Baş sahypa",
      searchPlaceholder: "Okuwçynyň ady boýunça gozleg...",
      thName: "Okuwçynyň ady",
      thExam1: "Synag 1",
      thExam2: "Synag 2",
      thExam3: "Synag 3"
    }
  };

  const langBtns = document.querySelectorAll('.lang-btn');

  langBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      const selectedLang = btn.getAttribute('data-lang');
      langBtns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      changeLanguage(selectedLang);
    });
  });

  function changeLanguage(lang) {
    document.querySelectorAll('[data-key]').forEach(el => {
      const key = el.getAttribute('data-key');
      if (translations[lang] && translations[lang][key]) {
        el.textContent = translations[lang][key];
      }
    });

    const searchInput = document.getElementById('searchInput');
    const phKey = searchInput.getAttribute('data-placeholder');
    if (phKey && translations[lang][phKey]) {
      searchInput.placeholder = translations[lang][phKey];
    }

    document.documentElement.lang = lang;
  }

  changeLanguage('ru');
</script>
